name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Install dependencies
        run: npm install --force

      - name: Test and coverage
        run: npm run coverage
        env:
          CI: true

      - name: Check coverage threshold
        run: |
          echo "✓ Coverage report generated"
          echo "Coverage will be validated by SonarCloud quality gates"
          
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          
  test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --force

      - name: Run tests
        run: npm run test

      - name: Test coverage on tests
        run: npm run coverage

      - name: Test eslint
        run: npm run lint

      - name: Test for code duplication
        run: npm run duplication

  # 🚀 Runs only after merge (push to main)
  ready-for-production:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Show production-ready message
        run: |
          echo "✅ All tests passed successfully!"
          echo "🚀 The code has been merged into MAIN."
          echo "🌐 The project is now ready for the next stage: production deployment!"



