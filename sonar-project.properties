sonar.projectKey=juanpab05_Q-Manager
sonar.organization=juanpab05
sonar.exclusions = report/**, public/**, coverage/**
sonar.cpd.exclusions=**/components/**,**/*.test.ts,**/*.test.tsx
# Source and test paths
sonar.sources=src
sonar.tests=src/pages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
# Coverage configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
# Coverage exclusions
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test/**,**/*.config.ts
# Language
sonar.sourceEncoding=UTF-8